<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIFA World Cup 2026 Bracket</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        h1 { text-align: center; }
        .bracket { display: flex; justify-content: space-between; gap: 40px; overflow-x: auto; padding: 20px 0; }
        .round { display: flex; flex-direction: column; justify-content: space-around; min-width: 220px; position: relative; }
        
        .match-wrapper { display: flex; align-items: center; position: relative; margin: 10px 0; }
        .match { border: 1px solid #ccc; border-radius: 5px; background: white; width: 100%; z-index: 2; }
        
        .team { padding: 8px 12px; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; gap: 10px; }
        .team:hover { background-color: #e0e0e0; }
        .team.selected { background-color: #4caf50; color: white; font-weight: bold; }
        .team:empty { background-color: #eee; cursor: not-allowed; }
        
        .flag { font-size: 1.2em; }

        /* Connecting Lines */
        .connector { position: absolute; border: 2px solid #aaa; border-left: none; z-index: 1; }
        
        @media print {
            @page { size: landscape; margin: 1cm; }
            body { transform: scale(0.50); transform-origin: top left; width: 140%; }
            .bracket { overflow-x: visible; }
        }
    </style>
</head>
<body>

    <h1>FIFA World Cup 2026 Bracket</h1>
    <div class="bracket" id="bracket"></div>

    <script>
        const initialMatchups = [
            ["Canada", "South Africa"], ["Netherlands", "Morocco"], ["Germany", "Paraguay"], ["France", "Sweden"], 
            ["Belgium", "Senegal"], ["United States", "Bosnia-Herzegovina"], ["Spain", "Austria"],
            ["Portugal", "Croatia"], ["Brazil", "Japan"], ["Cote d'Ivoire", "Norway"], ["Mexico", "Ecuador"],
            ["England", "Congo DR"], ["Switzerland", "Algeria"], ["Colombia", "Ghana"], ["Australia", "Egypt"], 
            ["Argentina", "Cabo Verde"]
        ];

        const flags = {
            "Canada": "🇨🇦", "South Africa": "🇿🇦", "Netherlands": "🇳🇱", "Morocco": "🇲🇦", "Germany": "🇩🇪",
            "Paraguay": "🇵🇾", "France": "🇫🇷", "Sweden": "🇸🇪", "Belgium": "🇧🇪", "Senegal": "🇸🇳",
            "United States": "🇺🇸", "Bosnia-Herzegovina": "🇧🇦", "Spain": "🇪🇸", "Austria": "🇦🇹",
            "Portugal": "🇵🇹", "Croatia": "🇭🇷", "Brazil": "🇧🇷", "Japan": "🇯🇵", "Cote d'Ivoire": "🇨🇮",
            "Norway": "🇳🇴", "Mexico": "🇲🇽", "Ecuador": "🇪🇨", "England": "🏴󠁧󠁢󠁥󠁮󠁧󠁿", "Congo DR": "🇨🇩",
            "Switzerland": "🇨🇭", "Algeria": "🇩🇿", "Colombia": "🇨🇴", "Ghana": "🇬🇭", "Australia": "🇦🇺",
            "Egypt": "🇪🇬", "Argentina": "🇦🇷", "Cabo Verde": "🇨🇻"
        };

        let rounds = [];
        
        function setupBracket() {
            let currentRound = initialMatchups.map((m, i) => ({ id: `0-${i}`, teams: m, winner: null }));
            rounds.push(currentRound);

            let matchCount = currentRound.length / 2;
            let roundIndex = 1;

            while (matchCount >= 1) {
                let nextRound = [];
                for (let i = 0; i < matchCount; i++) {
                    nextRound.push({ id: `${roundIndex}-${i}`, teams: ["", ""], winner: null });
                }
                rounds.push(nextRound);
                matchCount /= 2;
                roundIndex++;
            }
            renderBracket();
        }

        function advanceWinner(roundIdx, matchIdx, teamName) {
            if (!teamName) return;
            
            let match = rounds[roundIdx][matchIdx];
            match.winner = teamName;

            if (roundIdx + 1 < rounds.length) {
                let nextMatchIdx = Math.floor(matchIdx / 2);
                let nextTeamSlot = matchIdx % 2;
                rounds[roundIdx + 1][nextMatchIdx].teams[nextTeamSlot] = teamName;
                
                clearFutureRounds(roundIdx + 1, nextMatchIdx);
            }
            renderBracket();
        }

        function clearFutureRounds(roundIdx, matchIdx) {
            for (let r = roundIdx; r < rounds.length; r++) {
                let match = rounds[r][matchIdx];
                if (match.winner) {
                    match.winner = null;
                    if (r + 1 < rounds.length) {
                        let nextMatchIdx = Math.floor(matchIdx / 2);
                        let nextTeamSlot = matchIdx % 2;
                        rounds[r + 1][nextMatchIdx].teams[nextTeamSlot] = "";
                        matchIdx = nextMatchIdx;
                    }
                } else { break; }
            }
        }

        function renderBracket() {
            const bracketEl = document.getElementById('bracket');
            bracketEl.innerHTML = '';

            rounds.forEach((round, rIdx) => {
                const roundEl = document.createElement('div');
                roundEl.className = 'round';
                
                round.forEach((match, mIdx) => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'match-wrapper';
                    
                    const matchEl = document.createElement('div');
                    matchEl.className = 'match';

                    match.teams.forEach(team => {
                        const teamEl = document.createElement('div');
                        teamEl.className = `team ${team && team === match.winner ? 'selected' : ''}`;
                        
                        if (team) {
                            teamEl.innerHTML = `<span class="flag">${flags[team] || ''}</span> ${team}`;
                            teamEl.onclick = () => advanceWinner(rIdx, mIdx, team);
                        } else {
                            teamEl.innerText = "TBD";
                        }
                        matchEl.appendChild(teamEl);
                    });

                    wrapper.appendChild(matchEl);
                    roundEl.appendChild(wrapper);
                });

                bracketEl.appendChild(roundEl);
            });
            
            setTimeout(drawConnectors, 50);
        }

        function drawConnectors() {
            const roundsEls = document.querySelectorAll('.round');
            for (let r = 0; r < roundsEls.length - 1; r++) {
                const currentMatches = roundsEls[r].querySelectorAll('.match-wrapper');
                const nextMatches = roundsEls[r + 1].querySelectorAll('.match-wrapper');
                
                for (let m = 0; m < currentMatches.length; m += 2) {
                    const match1 = currentMatches[m];
                    const match2 = currentMatches[m+1];
                    const nextMatch = nextMatches[Math.floor(m/2)];
                    
                    if (!match1 || !match2 || !nextMatch) continue;

                    const rect1 = match1.getBoundingClientRect();
                    const rect2 = match2.getBoundingClientRect();
                    const rectNext = nextMatch.getBoundingClientRect();
                    const parentRect = roundsEls[r].getBoundingClientRect();

                    const top = (rect1.top + rect1.height/2) - parentRect.top;
                    const bottom = (rect2.top + rect2.height/2) - parentRect.top;
                    const height = bottom - top;
                    const right = rect1.right - parentRect.left;
                    const width = (rectNext.left - rect1.right);

                    const connector = document.createElement('div');
                    connector.className = 'connector';
                    connector.style.top = `${top}px`;
                    connector.style.left = `${right}px`;
                    connector.style.width = `${width}px`;
                    connector.style.height = `${height}px`;
                    connector.style.borderTop = '2px solid #aaa';
                    connector.style.borderBottom = '2px solid #aaa';
                    connector.style.borderRight = '2px solid #aaa';

                    roundsEls[r].appendChild(connector);
                }
            }
        }

        window.onresize = renderBracket;
        setupBracket();
        advanceWinner(0, 0, "Canada");
    </script>
</body>
</html>
